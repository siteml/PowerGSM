# PowerGSM release workflow.
#
# Triggered by pushing a v*.*.* tag. Builds Manager + Node + NodeSetup
# (Windows) and Node + NodeSetup (Linux), zips them, and creates a
# GitHub Release with the matching CHANGELOG section as release notes.
#
# Versioning lives in Directory.Build.props at the solution root —
# bump there BEFORE tagging. The tag is the trigger, not the source
# of version metadata: assemblies stamp from Directory.Build.props,
# and this workflow only uses the tag to derive zip filenames and
# the CHANGELOG section to extract.
#
# See VERSIONING.md for the full release procedure.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  # Needed by softprops/action-gh-release to create the Release entry
  # and upload assets. Read access to the repo content is the implicit
  # default; we add write here for the release surface only.
  contents: write

jobs:
  # ============================================================
  #  Windows artifacts: Manager + Node (win-x64)
  #
  #  Manager requires Windows because of WinForms. Node is built
  #  here too (rather than only on Linux) because Node's publish
  #  pulls in the win-x64 self-contained CtrlCSender helper, and
  #  the CtrlCSender source is Windows-only (P/Invokes kernel32).
  # ============================================================
  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine version from tag
        id: version
        # Bash on Windows runner — git-bash is preinstalled and
        # understood by GitHub Actions when shell: bash is set.
        # Strips the leading "v" so the tag "v0.1.0" yields "0.1.0",
        # which is what the assembly version and zip filenames expect.
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Restore the whole solution once. Each subsequent publish uses
      # --no-restore to skip redundant restores. Restore-on-publish
      # would also work, but doing it once at the top makes failures
      # easier to attribute to a single step.
      #
      # PublishReadyToRun=true is pinned because the publish steps
      # below also pin it. R2R needs the platform-specific runtime
      # package (Microsoft.NETCore.App.Runtime.<rid> for crossgen2)
      # to be RESTORED — not just available at publish time. Without
      # this flag on restore, publish errors with NETSDK1094: "Unable
      # to optimize assemblies for performance: a valid runtime
      # package was not found." The flag has no effect on projects
      # that don't end up using R2R (Contracts, CtrlCSender at this
      # restore stage) — they just see a property they ignore.
      - name: Restore solution
        run: dotnet restore PowerGSM.sln -p:PublishReadyToRun=true

      # Order matters here: Node publishes FIRST so its publish folder
      # exists. NodeSetup's Win64.pubxml then copies itself into Node's
      # publish folder via the DeployToNodeFolder MSBuild target. Doing
      # NodeSetup first would either silently no-op the copy (folder
      # missing) or fail outright depending on MSBuild's mood that day.
      # PublishProfileFullPath rather than PublishProfile because
      # the SDK's PublishProfile search path is hardcoded to
      # Properties\PublishProfiles\, but VB.NET projects keep their
      # pubxml files under My Project\PublishProfiles\. Visual
      # Studio passes the full path explicitly when publishing from
      # the IDE, so VS works fine. CLI publish needs the explicit
      # path or it silently falls back to framework defaults
      # (NETSDK1198 warning, but build still "succeeds" with the
      # wrong shape — no SelfContained, no PublishSingleFile, etc.).
      #
      # PublishDir overridden explicitly for the same reason as
      # the Manager step below and the Linux jobs further down:
      # pubxml <PublishDir> values are unreliable on CLI publish
      # for self-contained / multi-TFM scenarios. The .NET 8 SDK's
      # RID-aware default and the pubxml's value race, and which
      # wins depends on path-resolution mood. Pin it explicitly.
      # Lands at GSM.Node\publish\node-win-x64\.
      #
      # RuntimeIdentifier passed explicitly even though the pubxml
      # already sets it. The pubxml's value isn't visible to
      # target Condition expressions on BeforeTargets="Publish"
      # hooks (which fire before _ResolvePublishProfile imports
      # the pubxml), so RID-gated targets in GSM.Node.vbproj see
      # an empty $(RuntimeIdentifier) and the gate's "empty means
      # default-Windows" clause fires when it shouldn't. Pinning
      # via -p: applies it at command-line scope, before any
      # target evaluates. On Windows this is mostly belt-and-
      # suspenders since the wrong-reason path produces the right
      # outcome (CtrlCSender wants win-x64 anyway), but the Linux
      # job legitimately needs the same fix and we want both jobs
      # symmetric.
      #
      # SelfContained pinned for the same propagation reason. The
      # pubxml's <SelfContained>true</SelfContained> doesn't always
      # take effect on CLI publish; the v0.2.0 release went out
      # framework-dependent despite all three pubxmls saying
      # otherwise, prompting users for the .NET 8 runtime on fresh
      # PCs. Pinning via -p: makes the publish reliably bundle the
      # runtime so the zips run anywhere with no prerequisites.
      #
      # PublishSingleFile + PublishReadyToRun pinned for the same
      # propagation reason — the pubxml has both set, but CLI
      # publish doesn't read pubxml values reliably (the same root
      # cause as the SelfContained issue above). Without these,
      # GSM.Node ships as a folder of ~200 runtime DLLs instead of
      # one GSM.Node.exe — still self-contained, still functional,
      # but a worse deploy shape than intended. The other four
      # publish steps in this workflow already pin these flags;
      # Node Windows missing them was an oversight when the v0.2.0
      # postmortem pinned SelfContained on every step.
      - name: Publish Node (win-x64)
        run: dotnet publish GSM.Node/GSM.Node.vbproj -p:PublishProfileFullPath="GSM.Node/My Project/PublishProfiles/winx64.pubxml" -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:PublishDir=publish/node-win-x64/ --no-restore

      # NodeSetup is multi-targeted (net8.0;net8.0-windows). The SDK's
      # CrossTargeting check fires BEFORE the pubxml's TargetFramework
      # is read, so even though Win64.pubxml says net8.0-windows, the
      # CLI errors with NETSDK1129 unless we pass -f explicitly.
      #
      # NodeDeploymentDir overridden so DeployToNodeFolder copies
      # into the new Node publish location set above. The pubxml's
      # default points at GSM.Node\bin\Release\net8.0\publish\,
      # which we just stopped using. Absolute path because relative
      # paths in MSBuild properties resolve against the project
      # being built (NodeSetup), not the workspace root.
      #
      # PublishDir overridden too. The pubxml's value silently loses
      # to the SDK's RID-aware default on multi-TFM publish. With
      # the wrong PublishDir, DeployToNodeFolder's source glob
      # ($(PublishDir)**\*) matches an empty directory and 0 files
      # get copied into the node folder — NodeSetup.exe goes
      # missing without any error. Pinning a project-relative path
      # makes the publish output and the deploy source agree.
      #
      # RuntimeIdentifier + SelfContained + PublishSingleFile +
      # PublishReadyToRun all pinned for the same propagation
      # reason as the Node step above. Without these, NodeSetup
      # ships as a multi-file framework-dependent app that won't
      # run on a fresh box. Pubxml says all four; CLI repeats them
      # so they actually take effect.
      - name: Publish NodeSetup into Node folder (win-x64)
        run: dotnet publish GSM.NodeSetup/GSM.NodeSetup.vbproj -f net8.0-windows -p:PublishProfileFullPath="GSM.NodeSetup/My Project/PublishProfiles/Win64.pubxml" -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:PublishDir=publish/nodesetup-win-x64/ -p:NodeDeploymentDir=${{ github.workspace }}/GSM.Node/publish/node-win-x64/ --no-restore

      # Manager: PublishDir overridden explicitly because the
      # pubxml's <PublishDir>bin\Release\net8.0-windows\publish\win-x64\</PublishDir>
      # appears to be ignored or recomputed by the SDK on CLI
      # publish in some path-resolution path — the .NET 8 SDK's
      # RID-aware default for self-contained publishes is
      # bin\Release\TFM\RID\publish\ (RID before "publish"), and
      # we'd rather pin the location explicitly than depend on
      # which one wins. Path is relative to the project, so this
      # lands at GSM.Manager\publish\manager-win-x64\.
      #
      # RuntimeIdentifier + SelfContained + PublishSingleFile +
      # PublishReadyToRun all pinned for the same propagation
      # reason as the Node and NodeSetup steps above. The v0.2.0
      # release that went out without these pins prompted users
      # for the .NET 8 Desktop Runtime on fresh PCs because
      # Manager came out framework-dependent despite the pubxml
      # saying otherwise. The pubxml is honored by VS dev publish
      # but not reliably by CLI publish; CLI repeats the values
      # so they actually take effect.
      - name: Publish Manager (win-x64)
        run: dotnet publish GSM.Manager/GSM.Manager.vbproj -p:PublishProfileFullPath="GSM.Manager/My Project/PublishProfiles/FolderProfile.pubxml" -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:PublishDir=publish/manager-win-x64/ --no-restore

      # Diagnostic listings before each zip — cheap, and means
      # the next time a path mystery happens we can see what's
      # actually there rather than guessing. No -First N truncation
      # here: the Node publish folder has hundreds of runtime DLLs
      # and the files we actually care about (GSM.NodeSetup.exe,
      # GSM.CtrlCSender.exe) sort alphabetically AFTER all the
      # Microsoft.* DLLs, so a truncated listing hides exactly
      # what we'd want to verify.
      - name: List Node publish output
        shell: pwsh
        run: Get-ChildItem GSM.Node\publish\node-win-x64

      - name: List Manager publish output
        shell: pwsh
        run: Get-ChildItem GSM.Manager\publish\manager-win-x64 | Select-Object -First 30

      # PowerShell's Compress-Archive zips the directory's CONTENTS when
      # the path ends with \*. The zip therefore unpacks flat (no
      # PowerGSM-Node-0.1.0-win-x64\ wrapper folder), which is what
      # users expect for a "drop next to your install dir" deploy.
      - name: Zip Node artifact
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive `
            -Path "GSM.Node\publish\node-win-x64\*" `
            -DestinationPath "PowerGSM-Node-$version-win-x64.zip" `
            -CompressionLevel Optimal

      # BUILD-INFO.json travels INSIDE the Manager zip (the zip globs
      # the publish folder, so writing it here is enough). Phase 5l-3's
      # plugin-compatibility pre-flight reads it from the staged update
      # and compares contractsVersion against the running install's own
      # BUILD-INFO.json to warn when a Contracts bump could break
      # Roslyn-compiled plugins — without having to compile anything
      # first. GSM.Contracts.dll is published as a loose file (it's
      # ExcludeFromSingleFile=true so Roslyn can reference it), so its
      # assembly version is readable straight from the publish folder;
      # contractsVersion stays null if it's ever bundled, which the
      # consumer treats as "unknown, proceed with caution".
      - name: Write BUILD-INFO.json (Manager)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $dir = "GSM.Manager\publish\manager-win-x64"
          $contractsDll = Join-Path $dir "GSM.Contracts.dll"
          $contractsVersion = $null
          if (Test-Path $contractsDll) {
            $contractsVersion = [System.Reflection.AssemblyName]::GetAssemblyName($contractsDll).Version.ToString()
          }
          $info = [ordered]@{
            product           = "PowerGSM.Manager"
            version           = $version
            tag               = "v$version"
            commit            = "${{ github.sha }}"
            buildUtc          = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            targetFramework   = "net8.0-windows"
            runtimeIdentifier = "win-x64"
            contractsVersion  = $contractsVersion
          }
          $json = $info | ConvertTo-Json
          Set-Content -Path (Join-Path $dir "BUILD-INFO.json") -Value $json -Encoding UTF8
          Write-Host $json

      - name: Zip Manager artifact
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive `
            -Path "GSM.Manager\publish\manager-win-x64\*" `
            -DestinationPath "PowerGSM-Manager-$version-win-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            PowerGSM-Node-*-win-x64.zip
            PowerGSM-Manager-*-win-x64.zip
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  #  Linux artifacts: Node (linux-x64) only
  #
  #  No Manager on Linux — WinForms is Windows-only and the Manager
  #  is the WinForms half of the system. Linux users run the Node
  #  service alone, managed remotely by a Windows Manager.
  # ============================================================
  build-linux:
    name: Build Linux artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Restore only the projects this job will touch. A solution-wide
      # restore on Linux pulls in WinForms reference assemblies just
      # to satisfy GSM.Manager's restore graph, which works but adds
      # noise. Per-project restore keeps logs clean.
      #
      # EnableWindowsTargeting=true on the NodeSetup restore is
      # needed because NodeSetup is multi-targeted (net8.0 +
      # net8.0-windows). Restore resolves all TFMs unless told
      # otherwise, and `dotnet restore` doesn't honor --framework,
      # so the Windows-slot resolution trips the NETSDK1100 check
      # on Linux runners. Set the flag here and the publish steps
      # below stay simple.
      - name: Restore Node + NodeSetup
        run: |
          dotnet restore GSM.Node/GSM.Node.vbproj
          dotnet restore GSM.NodeSetup/GSM.NodeSetup.vbproj -p:EnableWindowsTargeting=true

      # See build-windows for the rationale on PublishProfileFullPath.
      #
      # RuntimeIdentifier pinned via -p: rather than relying on the
      # pubxml's <RuntimeIdentifier>. The pubxml's value isn't
      # visible to target Condition expressions on
      # BeforeTargets="Publish" hooks (which fire before
      # _ResolvePublishProfile imports the pubxml), so the RID
      # gates on GSM.Node.vbproj's CtrlCSender targets see an
      # empty $(RuntimeIdentifier) and the gate's empty-means-
      # Windows clause fires — the Linux job ends up cross-
      # compiling a win-x64 self-contained CtrlCSender.exe and
      # shipping it in the Linux zip. Pinning via -p: applies the
      # value at command-line scope, before any target evaluates.
      #
      # EnableWindowsTargeting=true was originally needed because
      # the cross-compile fired anyway (see above) and the inner
      # MSBuild needed Windows-targeting permission to succeed.
      # With the gate working, no win-targeting happens here.
      # We keep the flag as belt-and-suspenders against future
      # changes that might legitimately want to cross-target.
      #
      # PublishDir overridden for the same reason as Manager on the
      # Windows job: the pubxml's path doesn't reliably win against
      # the SDK's RID-aware default. Lands at
      # GSM.Node/publish/node-linux-x64/ relative to the project.
      #
      # SelfContained + PublishSingleFile pinned for the same
      # propagation reason as the Windows steps. Without these, the
      # Linux Node zip ships as a multi-file framework-dependent
      # app that needs ASP.NET Core 8 Runtime preinstalled. Pubxml
      # says both; CLI repeats them so they actually take effect.
      - name: Publish Node (linux-x64)
        run: dotnet publish GSM.Node/GSM.Node.vbproj -p:PublishProfileFullPath="GSM.Node/My Project/PublishProfiles/linux64.pubxml" -p:RuntimeIdentifier=linux-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:EnableWindowsTargeting=true -p:PublishDir=publish/node-linux-x64/ --no-restore

      # See build-windows for why -f is explicit. Linux build uses
      # the net8.0 (non-Windows) TFM — the .vbproj's <Compile Remove>
      # rule excludes the WinForms files when net8.0 is targeted.
      #
      # NodeDeploymentDir overridden so NodeSetup's DeployToNodeFolder
      # target copies into the new Node publish location set above.
      # Default in the pubxml points at the SDK-pubxml path that we
      # just stopped using. Absolute path because relative paths
      # would be relative to NodeSetup's project, not the workspace.
      #
      # PublishDir overridden too. Same propagation issue as the
      # Windows NodeSetup step — pubxml <PublishDir> loses to the
      # SDK's RID-aware default on multi-TFM publish, and the
      # mismatch makes DeployToNodeFolder's source glob hit an
      # empty directory. On the Linux job this manifested as zero
      # files deployed and a missing NodeSetup binary in the zip.
      #
      # RuntimeIdentifier + SelfContained + PublishSingleFile
      # pinned for the same propagation reason as the other steps.
      # No PublishReadyToRun here — Linux64.pubxml doesn't set it
      # (R2R targets are RID-specific and the dev-time pubxml only
      # bothers with R2R for Windows builds).
      - name: Publish NodeSetup into Node folder (linux-x64)
        run: dotnet publish GSM.NodeSetup/GSM.NodeSetup.vbproj -f net8.0 -p:PublishProfileFullPath="GSM.NodeSetup/My Project/PublishProfiles/Linux64.pubxml" -p:RuntimeIdentifier=linux-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishDir=publish/nodesetup-linux-x64/ -p:NodeDeploymentDir=$GITHUB_WORKSPACE/GSM.Node/publish/node-linux-x64/ --no-restore

      # Diagnostic listing — same rationale as the Windows job.
      - name: List Node publish output
        run: ls -la GSM.Node/publish/node-linux-x64/

      # zip is preinstalled on ubuntu-latest. Using zip rather than
      # tar.gz keeps the artifact format consistent with the Windows
      # zips, so users on either OS unpack with the same tool.
      - name: Zip Node artifact
        run: |
          version="${{ steps.version.outputs.version }}"
          cd GSM.Node/publish/node-linux-x64
          zip -r -9 "${GITHUB_WORKSPACE}/PowerGSM-Node-${version}-linux-x64.zip" .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: PowerGSM-Node-*-linux-x64.zip
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  #  Release: download both artifact sets, extract changelog
  #  section, create the GitHub Release.
  # ============================================================
  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Needed for CHANGELOG.md — the artifacts don't include it.
        uses: actions/checkout@v4

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Extract the section under "## [VERSION]" up to (but not
      # including) the next "## [". Output goes into a multi-line
      # output variable using GitHub Actions' heredoc syntax.
      #
      # awk logic:
      #   On any "## [" heading line:
      #     - If we already found our section, exit (we hit the
      #       NEXT section, so we're done).
      #     - Else if this heading is our target version, set the
      #       flag and skip printing the heading itself (release
      #       page shows the version in its title; duplicating it
      #       in the body would look silly).
      #     - Else skip — we haven't reached our section yet.
      #   For all other lines: print iff the flag is set.
      - name: Extract changelog section
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          notes=$(awk -v v="$version" '
            /^## \[/ {
              if (found) exit
              if ($2 == "[" v "]") { found = 1; next }
              next
            }
            found
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "ERROR: No '## [$version]' section found in CHANGELOG.md" >&2
            echo "Add a section for $version before tagging the release." >&2
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        # Sanity log so a failed upload step has a paper trail
        # showing what was actually present in artifacts/ before
        # the release call.
        run: ls -la artifacts/

      # SHA256SUMS is a release asset (not inside any zip) listing the
      # checksum of every release zip. Phase 5l-2 downloads it first,
      # then verifies the Manager zip it pulls against the matching
      # line before extracting/applying — the integrity gate for
      # self-update. Standard `sha256sum` format ("<hash>  <name>"),
      # so it also verifies with `sha256sum -c SHA256SUMS`. Generated
      # from inside artifacts/ so the names are bare basenames.
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum PowerGSM-*.zip | tee SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PowerGSM ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            artifacts/PowerGSM-Manager-*.zip
            artifacts/PowerGSM-Node-*.zip
            artifacts/SHA256SUMS
          draft: false
          # Tags containing a hyphen (0.1.0-rc1, 0.2.0-beta) are
          # marked pre-release. GitHub's UI surfaces these
          # differently from full releases; users browsing
          # /releases see the latest stable highlighted.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
